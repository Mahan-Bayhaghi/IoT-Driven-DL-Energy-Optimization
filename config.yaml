data:
  dataset_path: "data/raw/eia_energy_data.csv"
  sequence_length: 24
  train_size: 0.8
  val_size: 0.1
  test_size: 0.1

preprocessing:
  normalization: "minmax"
  feature_columns: ["Value"]
  target_column: "energy_consumption"

model:
  cnn_bilstm:
    cnn_filters: [64, 128]
    kernel_sizes: [3, 5]
    pool_size: 2
    lstm_units: [100, 50]
    dropout_rate: 0.2
    learning_rate: 0.001

  hyperparameters:
    grid_search:
      learning_rates: [0.001, 0.0001]
      hidden_sizes: [50, 100, 150]
      kernel_sizes: [3, 5, 7]

training:
  batch_size: 32
  epochs: 100
  early_stopping_patience: 10

evaluation:
  metrics: ["mae", "rmse", "r2"]